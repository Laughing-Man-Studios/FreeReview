name: consumer-smoke
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Action ref to install, e.g. v0.1.0 or main"
        required: false
        default: "v0.1.0"

# Proves the Phase 8 exit criterion: a tagged release installs and runs from a
# consumer repository that shares none of this project's build state.
#
# Deliberately does NOT checkout FreeReview or run its tests. A consumer installs
# the action as a published ref and runs the committed bundle; if that works, the
# packaging works. Building here and running that would prove something different
# and easier.
# `contents: write` is required to push the probe branch at all — opening a pull
# request is not enough without it. Scoped to this workflow and this repository.
permissions:
  contents: write
  pull-requests: write

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show what is being installed
        run: |
          echo "action.yml present: $([ -f action.yml ] && echo yes || echo no)"
          echo "committed bundle:  $([ -f dist/index.js ] && echo yes || echo no)"
          echo "installing from:   ${{ inputs.ref }}"

      - name: Push the probe branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          # Uses the runner's preinstalled `gh` rather than a third-party action, for
          # the same reason release.yml does: it keeps the supply chain for the
          # release path empty. peter-evans/create-pull-request also conflicts with
          # checkout's credential helper here — "Duplicate header: Authorization" —
          # and fixing that would have meant accepting the dependency anyway.
          BRANCH="freereview-consumer-smoke"
          # Checkout ran with persist-credentials:false so it would not inject an
          # extraheader that duplicates the one `gh` sets. That leaves git with no
          # credential, so `gh` has to configure the helper for the push.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"

          # Writes the probe workflow itself, pinned to the requested ref.
          #
          # Two reasons, and the second is the important one:
          #
          #  1. The probe is path-filtered to fire only when this file changes, so
          #     without writing it the probe never runs at all. It has never run.
          #  2. Writing it *here* is what pins the ref under test. A probe file
          #     committed to the branch by hand gets clobbered by the next run,
          #     because this workflow force-pushes the branch from main.
          #
          # Together these mean the ref under test can never drift from the ref
          # actually exercised.
          mkdir -p .github/workflows
          cat > .github/workflows/consumer-smoke-probe.yml <<'PROBE'
          name: probe
          on:
            pull_request:
              paths: [".github/workflows/consumer-smoke-probe.yml"]

          permissions:
            contents: read
            pull-requests: write

          jobs:
            review:
              runs-on: ubuntu-latest
              steps:
                - uses: Laughing-Man-Studios/FreeReview@__REF__
                  with:
                    openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
                    github_token: ${{ github.token }}
          PROBE
          sed -i "s|@__REF__|@${REF}|" .github/workflows/consumer-smoke-probe.yml

          # A real file with a real defect. An empty commit exercises the
          # "nothing to review" path instead, which proves much less: the review
          # then correctly finds nothing, and a broken run looks like a pass.
          mkdir -p src
          cat > src/consumer-smoke-probe.ts <<'SRC'
          export function percentile(values: number[], p: number): number {
            if (!values) {
              return 0;
            }
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.floor(p * sorted.length)];
          }
          SRC

          git add .github/workflows/consumer-smoke-probe.yml src/consumer-smoke-probe.ts
          git commit -m "test: exercise FreeReview@${REF} on a clean diff"

          PUSHED=0
          if git push --force origin "$BRANCH"; then PUSHED=1; fi

          # The branch may already exist from a previous run, in which case a PR may
          # already be open against it.
          if [ "$PUSHED" = "0" ]; then
            EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "::error::could not push the probe branch and no open pull request exists"
              exit 1
            fi
            echo "::error::could not push the probe branch and no open pull request exists"
            exit 1
          fi

          git checkout main 2>/dev/null || git checkout master

          # Deliberately does NOT create the pull request.
          #
          # The organisation forbids GitHub Actions from creating or approving pull
          # requests — the same restriction that removed release-please from this
          # repository. The API returns "GitHub Actions is not permitted to create or
          # approve pull requests". Working around it with a personal token would be
          # exactly the kind of quietly-defeated control this project rejects, so the
          # workflow pushes the branch and waits; a maintainer opens the pull request.
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "open https://github.com/$GITHUB_REPOSITORY/pull/new/$BRANCH"

      - name: Wait for the review to appear
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          # Resolving the pull request from the branch, because this workflow is not
          # permitted to create one. A maintainer opens it; the automation verifies.
          PR_NUMBER=""
          for _ in $(seq 1 20); do
            PR_NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            [ -n "$PR_NUMBER" ] && break
            sleep 15
          done

          if [ -z "$PR_NUMBER" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pull request exists for branch $BRANCH. This organisation forbids" >&2
            echo "Actions from creating one, so it must be opened manually:" >&2
            echo "  https://github.com/$GITHUB_REPOSITORY/pull/new/$BRANCH" >&2
            exit 0
          fi
          echo "Pull request #$PR_NUMBER found."

          # Reviews and issue comments are DIFFERENT GitHub endpoints, and FreeReview
          # posts a review. Querying only /issues/N/comments finds nothing for a
          # successful run — it polls for ten minutes and reports a failure that is
          # actually its own bug.
          #
          # Both are checked because a degraded run with no placeable findings
          # publishes a summary-only review, and any future path that used an issue
          # comment should not silently break this check again.
          for _ in $(seq 1 40); do
            BODY=$(
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
                --jq '[.[] | select(.user.type=="Bot") | .body] | join("\n---\n")' 2>/dev/null || true
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                --jq '[.[] | select(.user.type=="Bot") | .body] | join("\n---\n")' 2>/dev/null || true
            )
            if printf '%s' "$BODY" | grep -q "FreeReview"; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "Review comment:"; printf '%s\n' "$BODY" | head -40
              exit 0
            fi
            sleep 15
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Report
        if: always()
        env:
          FOUND: ${{ steps.wait.outputs.found }}
        run: |
          {
            echo "### Consumer smoke test"
            echo
            if [ "$FOUND" = "true" ]; then
              echo "The action installed from \`${{ inputs.ref }}\`, ran on a pull request"
              echo "this repository did not author, and published a review on #${{ steps.wait.outputs.pr }}."
              echo
              echo "This is the Phase 8 exit criterion: a tagged release installs and runs."
            else
              echo "No review comment appeared within 10 minutes, or no pull request was open."
              echo
              echo "**This does not necessarily mean the action is broken.** A run can legitimately"
              echo "produce no findings, and the body says so rather than staying silent — but it"
              echo "always comments. No comment at all means the workflow did not reach publication,"
              echo "which is a packaging or permission failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
