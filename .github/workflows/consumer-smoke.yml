name: consumer-smoke
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Action ref to install, e.g. v0.1.0 or main"
        required: false
        default: "v0.1.0"

# Proves the Phase 8 exit criterion: a tagged release installs and runs from a
# consumer repository that shares none of this project's build state.
#
# Deliberately does NOT checkout FreeReview or run its tests. A consumer installs
# the action as a published ref and runs the committed bundle; if that works, the
# packaging works. Building here and running that would prove something different
# and easier.
permissions:
  contents: read
  pull-requests: write

jobs:
  install-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show what is being installed
        run: |
          echo "action.yml present: $([ -f action.yml ] && echo yes || echo no)"
          echo "committed bundle:  $([ -f dist/index.js ] && echo yes || echo no)"
          echo "installing from:   ${{ inputs.ref }}"

      - name: Open a pull request that exercises the action
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          # Uses the runner's preinstalled `gh` rather than a third-party action, for
          # the same reason release.yml does: it keeps the supply chain for the
          # release path empty. peter-evans/create-pull-request also conflicts with
          # checkout's credential helper here — "Duplicate header: Authorization" —
          # and fixing that would have meant accepting the dependency anyway.
          BRANCH="freereview-consumer-smoke"
          # Checkout ran with persist-credentials:false so it would not inject an
          # extraheader that duplicates the one `gh` sets. That leaves git with no
          # credential, so `gh` has to configure the helper for the push.
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git commit --allow-empty -m "test: exercise FreeReview@$REF on a clean diff"

          PUSHED=0
          if ! git push --force origin "$BRANCH"; then PUSHED=1; fi
          # The branch may already exist from a previous run, in which case a PR may
          # already be open against it.
          if [ "$PUSHED" = "0" ]; then
            EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING" ]; then
              echo "Reusing pull request #$EXISTING from a previous run."
              echo "number=$EXISTING" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::could not push the probe branch and no open pull request exists"
            exit 1
          fi

          git checkout main 2>/dev/null || git checkout master

          PR_NUMBER=$(gh pr create \
            --head "$BRANCH" \
            --title "test: exercise FreeReview@$REF on a clean diff" \
            --body "Automated consumer smoke test. Installs the published action ref and opens a pull request so the action runs against a diff this repository did not author.\n\nThe probe workflow is pinned to \`$REF\`." \
            | grep -oE '[0-9]+$')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Wait for the review to appear
        id: wait
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const deadline = Date.now() + 8 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER),
              });
              const review = data.find(c => c.user?.type === "Bot" && /FreeReview/.test(c.body ?? ""));
              if (review) {
                core.setOutput("found", "true");
                core.info(review.body.slice(0, 800));
                return;
              }
              await new Promise(r => setTimeout(r, 15000));
            }
            core.setOutput("found", "false");

      - name: Report
        if: always()
        env:
          FOUND: ${{ steps.wait.outputs.found }}
        run: |
          {
            echo "### Consumer smoke test"
            echo
            if [ "$FOUND" = "true" ]; then
              echo "The action installed from \`${{ inputs.ref }}\`, ran on a pull request"
              echo "this repository did not author, and published a review."
              echo
              echo "This is the Phase 8 exit criterion: a tagged release installs and runs."
            else
              echo "No review comment appeared within 8 minutes."
              echo
              echo "**This does not necessarily mean the action is broken.** A run can legitimately"
              echo "produce no findings, and the body says so rather than staying silent — but it"
              echo "always comments. No comment at all means the workflow did not reach publication,"
              echo "which is a packaging or permission failure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
