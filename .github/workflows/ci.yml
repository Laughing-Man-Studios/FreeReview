name: CI

# No secrets are required to build or test this action. Nothing here needs
# write access to the repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs. Free CI minutes, and faster feedback on push-over-PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    # A malformed workflow fails at 0s with zero jobs, producing a red X and no
    # diagnostic at all. This catches that before merge. It has already earned
    # its place: it found the invalid `release_created` trigger and a
    # cross-job `steps` reference, both of which failed opaquely.
    #
    # Invoked as a Docker image so no third-party JavaScript is executed.
    # No `args`: a Docker action receives them as a literal string, so a `*.yml`
    # glob would never expand. actionlint's documented default with no
    # arguments is to lint every workflow under .github/workflows.
    steps:
      # Required. Without it the workspace is empty and actionlint exits with
      # "no project was found in any parent directories" — a confusing failure
      # that looks like a misconfiguration rather than a missing step.
      - uses: actions/checkout@v6
      - uses: docker://rhysd/actionlint:1.7.12

  verify:
    name: typecheck, lint, test, build, dist integrity
    runs-on: ubuntu-latest
    # Matches `runs.using: node24` in action.yml. A node20 job would test a
    # configuration that cannot occur in production, because the action only
    # ever executes on the runtime it declares.
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Property-based invariant tests
        run: npm run test:property

      - name: Integration tests (mocked GitHub + OpenRouter)
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Security assertions against the shipped bundle
        run: npm run test:security

      # Runs last and is the gate: the committed dist/ must reflect src/.
      # Deliberately after `build` so a source change that was not rebuilt is
      # caught, and deliberately read-only so it cannot paper over a stale
      # bundle by regenerating it.
      - name: dist/ integrity
        run: npm run check:dist

      # action.yml is parsed as an expression template by the runner, so a
      # stray template expression in an input description makes every
      # `uses:` invocation in every consumer fail at load time. This repo's own
      # tests all pass in that state, because nothing here loads the action.
      - name: action.yml validity
        run: npm run check:action

      # A changelog compare link that points at a non-existent tag renders as a
      # dead link on the release page and in the repository view. The unit test
      # cannot catch it: whether `1.0.2` or `v1.0.2` is correct is not derivable
      # from the file's own contents, so this asks the remote instead. `1.0.2`
      # was released without the `v` prefix and is immutable, so this is not
      # hypothetical.
      - name: changelog compare links
        run: npm run check:changelog

      # The golden dataset is a set of claims about ground truth. A wrong claim
      # is worse than a missing fixture: it would make the evaluation
      # confidently report the reviewer as wrong when the author was. This runs
      # every expected quote through the real anchor resolver and fails on any
      # disagreement, so the dataset also serves as an end-to-end anchoring
      # regression suite. Costs zero requests.
      - name: golden dataset ground truth
        run: npm run validate:fixtures

      - name: Report catalog state
        # Non-blocking by design. The free catalog is a third party and a drifting
        # one is not our outage — but a green run here is informative rather than
        # silent, so a change in ZDR availability or measured modes is visible in
        # the log even when nothing has broken yet.
        run: npm run verify-models

  full-suite:
    name: full test suite (all directories)
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v6
      - run: npm ci --no-audit --no-fund
      - run: npm test
