name: CI

# No secrets are required to build or test this action. Nothing here needs
# write access to the repository.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs. Free CI minutes, and faster feedback on push-over-PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    # A malformed workflow fails at 0s with zero jobs, producing a red X and no
    # diagnostic at all. This catches that before merge. It has already earned
    # its place: it found the invalid `release_created` trigger and a
    # cross-job `steps` reference, both of which failed opaquely.
    #
    # Invoked as a Docker image so no third-party JavaScript is executed.
    # No `args`: a Docker action receives them as a literal string, so a `*.yml`
    # glob would never expand. actionlint's documented default with no
    # arguments is to lint every workflow under .github/workflows.
    steps:
      - uses: docker://rhysd/actionlint:1.7.12

  verify:
    name: typecheck, lint, test, build, dist integrity
    runs-on: ubuntu-latest
    # Matches `runs.using: node24` in action.yml. A node20 job would test a
    # configuration that cannot occur in production, because the action only
    # ever executes on the runtime it declares.
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Property-based invariant tests
        run: npm run test:property

      - name: Integration tests (mocked GitHub + OpenRouter)
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Security assertions against the shipped bundle
        run: npm run test:security

      # Runs last and is the gate: the committed dist/ must reflect src/.
      # Deliberately after `build` so a source change that was not rebuilt is
      # caught, and deliberately read-only so it cannot paper over a stale
      # bundle by regenerating it.
      - name: dist/ integrity
        run: npm run check:dist

  full-suite:
    name: full test suite (all directories)
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v6
      - run: npm ci --no-audit --no-fund
      - run: npm test
