name: probe
on:
  pull_request:
    paths: [".github/workflows/consumer-smoke-probe.yml"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: Laughing-Man-Studios/FreeReview@v1
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          github_token: ${{ github.token }}
