name: Release

# Manual, deliberate releases.
#
# This replaces release-please, which could not run: the organisation forbids
# GitHub Actions from creating or approving pull requests, and opening a
# release PR is release-please's entire model. Repurposing that with a
# "maintainer" token is a workaround; this is not.
#
# A manual trigger is also the right call for a pre-release action. With
# release-please, any merged `feat:` commit produces a release PR and the
# version floats up on its own. Here, a human decides when to cut v1 — which
# matters, because v1 is the Marketplace listing and should not ship until the
# pipeline provably works.
#
# Uses the runner's preinstalled `gh` CLI. No third-party release action is
# executed, which keeps the supply chain for the release path empty.
#
# Requires org "Administration: write" to create the tag and release, which
# the default GITHUB_TOKEN does not have.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 or v1.0.0"
        required: true
        type: string
      notes:
        description: "Extra release notes. If omitted, the matching CHANGELOG.md section is used."
        required: false
        type: string
      dry_run:
        description: "Verify everything but do not tag or publish"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  # Never cancel a release partway. Losing a half-tagged release is worse than
  # waiting for the previous one to finish.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Always release from main, never from the branch that triggered this.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm ci --no-audit --no-fund

      # --- 1. Validate the requested version -------------------------------
      # Inputs are passed via `env:` and read as "$VAR" rather than being
      # interpolated straight into the script. Direct `${{ }}` interpolation
      # inside a run block is a script-injection vector: a value containing a
      # quote or `$(...)` becomes shell code.
      - name: Validate version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NORMALISED="${RAW_VERSION#v}"

          if ! printf '%s' "$NORMALISED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${RAW_VERSION}' is not a valid semver version. Expected e.g. 1.0.0 or v1.0.0"
            exit 1
          fi

          if git rev-parse "refs/tags/v${NORMALISED}" >/dev/null 2>&1; then
            echo "::error::tag v${NORMALISED} already exists. Bump the version or delete the tag."
            exit 1
          fi

          # One grouped redirect rather than three. actionlint/shellcheck SC2129:
          # separate `>>` appends to the same file each reopen it.
          {
            echo "version=${NORMALISED}"
            echo "tag=v${NORMALISED}"
            # The major is what the moving ref is named. Taken from the validated
            # normalised version, never the raw input, so `v1.0.0`, `1.0.0` and
            # `01.0.0` all resolve the same way.
            echo "major=${NORMALISED%%.*}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${NORMALISED} (moving ref will be 'v${NORMALISED%%.*}')"

      # --- 2. The artifact must be built from this exact source -------------
      # Rebuilding and comparing catches "source fixed, dist stale": a release
      # can never ship a bundle that does not reflect the tag's source.
      - name: Build
        run: npm run build

      - name: Verify committed dist matches source
        run: |
          set -euo pipefail
          git checkout -- dist/
          npm run check:dist

      # A release that ships an unparseable action.yml is worse than no release:
      # every consumer's `uses:` fails at load time with no code executed.
      - name: Verify action.yml loads
        run: npm run check:action

      - name: Verify the bundle is present and non-trivial
        run: |
          set -euo pipefail
          test -f dist/index.js || { echo "::error::dist/index.js missing. A JavaScript action must commit its bundle."; exit 1; }
          SIZE=$(wc -c < dist/index.js)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::dist/index.js is only ${SIZE} bytes. That is not a real bundle."
            exit 1
          fi
          echo "dist/index.js present (${SIZE} bytes)"

      # --- 3. Confirm the security invariants still hold on the artifact ----
      # Cheap, and the whole project rests on these.
      - name: Security assertions against the shipped bundle
        run: npm run test:security

      # --- 4. Assemble release notes ---------------------------------------
      # Precedence: the `notes` input wins, then the matching CHANGELOG.md
      # section, then a placeholder. Structured as a real if/else rather than
      # an `A && B || C` chain, which is ambiguous about which branch ran.
      - name: Resolve release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SUPPLIED_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SENTINEL=/tmp/notes-source

          if [ -n "${SUPPLIED_NOTES}" ]; then
            printf '%s\n' "${SUPPLIED_NOTES}" > /tmp/notes.md
            echo "input" > "$SENTINEL"
          elif [ -f CHANGELOG.md ]; then
            # Slice the section headed `## [x.y.z]` up to the next `## `.
            # Always exits 0; presence is reported via the sentinel file.
            #
            # String concatenation rather than a template literal, deliberately.
            # A `${...}` inside this single-quoted script is correct JavaScript and
            # correct shell (the shell must not expand it), but shellcheck cannot
            # tell the difference and reports SC2016. Rewriting the two
            # interpolations as concatenation removes the ambiguity at its source
            # instead of suppressing a warning that would otherwise need a disable
            # comment sitting inside a shell block — where it is easy to lose.
            node -e '
              const fs = require("node:fs");
              const version = process.argv[1].replace(/[.\-]/g, "\\$&");
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
              const start = lines.findIndex((l) => new RegExp("^## \\[?" + version + "\\]?").test(l));
              if (start === -1) { process.exit(0); }
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i++) {
                if (/^## /.test(lines[i])) { end = i; break; }
              }
              const body = lines.slice(start + 1, end).join("\n").trim();
              fs.writeFileSync("/tmp/notes.md", body || "_No changelog entries for this version._\n");
              fs.writeFileSync("/tmp/notes-found", "changelog");
            ' "$VERSION"
            if [ -f /tmp/notes-found ]; then
              echo "changelog" > "$SENTINEL"
            else
              echo "_No CHANGELOG.md section found for ${VERSION}._" > /tmp/notes.md
              echo "placeholder" > "$SENTINEL"
            fi
          else
            echo "_No release notes._" > /tmp/notes.md
            echo "placeholder" > "$SENTINEL"
          fi

          echo "Release notes source: $(cat "$SENTINEL")"

      # --- 4b. Can this workflow actually push? ----------------------------
      # Answered before anything is tagged, because the failure otherwise
      # surfaces halfway through a release: the tag would exist and the release
      # would not.
      #
      # `git push --dry-run` authenticates and checks branch protection and token
      # permissions without writing anything, so it answers the only question that
      # matters — can *this* token create the ref — rather than whether the
      # repository accepts pushes in principle.
      #
      # A workflow triggered from the UI uses the repository's own
      # `GITHUB_TOKEN`, whose ability to create tags and releases depends on the
      # organisation's settings. That is not knowable in advance, so it is probed.
      - name: Probe write permission
        id: permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Never fail the dry run on this: its purpose is to report the answer.
          PROBE_REF="refs/heads/_permission-probe-${{ github.run_id }}"

          if git push --dry-run origin "HEAD:${PROBE_REF}" >/tmp/probe.log 2>&1; then
            { echo "result=ok"; } >> "$GITHUB_OUTPUT"
            echo "This workflow can create refs and tags."
          else
            { echo "result=denied"; } >> "$GITHUB_OUTPUT"
            echo "::warning::title=Release token cannot push::This workflow could not verify write permission. A real release will fail at the tagging step."
            {
              echo
              echo "### ⚠️ This workflow cannot tag"
              echo
              echo 'The token available to this run cannot create refs, so cutting a release'
              echo 'through it will fail *after* the tag step. Two ways forward:'
              echo
              echo '1. Run the workflow from the UI and accept that it will fail, then tag and'
              echo '   publish yourself — the verification steps already passed, so the bundle is'
              echo '   confirmed good.'
              echo '2. Create the tag and release from your own account, then re-run'
              echo '   consumer-smoke.yml with ref: v1.'
              echo
              echo '<details><summary>probe output</summary>'
              echo
              echo '```'
              cat /tmp/probe.log
              echo '```'
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          # States what the real run would do to the moving ref, including whether
          # it already exists. A dry run that does not mention the ref at all is a
          # dry run that cannot catch the mistake this step was added for.
          REF="v${MAJOR}"
          if git ls-remote --exit-code origin "refs/heads/${REF}" >/dev/null 2>&1; then
            CURRENT=$(git ls-remote origin "refs/heads/${REF}" | cut -c1-12)
            REF_STATE="${REF} exists at ${CURRENT} and would be force-updated"
          else
            REF_STATE="${REF} does not exist yet and would be created"
          fi

          {
            echo "## Dry run — nothing was tagged or published"
            echo
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: $(git rev-parse --short HEAD)"
            echo "- Moving ref: ${REF_STATE}"
            echo "- Tag permission: ${{ steps.permission.outputs.result }}"
            echo
            echo "The README and the Marketplace listing install \`@${REF}\`. A tag alone does"
            echo "not satisfy that; the ref above is what makes the documented install work."
            echo
            if [ "${{ steps.permission.outputs.result }}" != "ok" ]; then
              echo "**This run cannot tag.** See the note above — cut the tag yourself, then"
              echo "re-run \`consumer-smoke.yml\` with \`ref: ${REF}\`."
              echo
            fi
            echo "### Notes"
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Dry run complete. Nothing was tagged, no release was published, and ${REF} was not moved."

      # --- 5. Tag and publish ----------------------------------------------
      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

          {
            echo "## ${TAG}"
            echo
            cat /tmp/notes.md
            echo
            echo "---"
            echo
            echo "Bundle verified against this tag's source, and security assertions passed."
          } > /tmp/release-body.md

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file /tmp/release-body.md \
            --verify-tag

          echo "::notice::Published ${TAG}"
          echo "review_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_OUTPUT"

      # --- 6. Move the major-version ref -----------------------------------
      # Why this step exists
      #
      # The README and the Marketplace listing both instruct consumers to install
      # `uses: Laughing-Man-Studios/FreeReview@v1`. GitHub resolves `@v1` against a
      # ref of that name, and cutting `v1.0.0` alone does NOT create one — so without
      # this step the documented installation is broken while the release looks
      # successful. That is the worst possible shape: green release, unusable
      # install instructions.
      #
      # It is a branch rather than a tag because tags are conventionally immutable
      # and this ref has to move on every 1.x release. A moving branch is also what
      # GitHub's own documentation recommends for exactly this case.
      #
      # Only the major is maintained. Cutting `v2.0.0` creates `v2` and leaves `v1`
      # alone, so a consumer pinned to v1 keeps getting the last 1.x — which is the
      # entire point of a moving major ref.
      - name: Move the major-version ref
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAJOR_REF="v${MAJOR}"

          # Point the ref at the commit that was just released, not at main. If
          # main has moved since, the ref must not silently advance to unreleased
          # work — that is the whole failure mode a pinned install protects against.
          COMMIT=$(git rev-parse "${TAG}^{commit}")

          git push --force origin "${COMMIT}:refs/heads/${MAJOR_REF}"
          echo "::notice::${MAJOR_REF} now points at ${COMMIT}"

      # The consumer-facing check, after the ref moves. Resolves the same ref the
      # README tells people to install, so a broken instruction fails the release
      # rather than the first person who follows it.
      - name: Verify the major ref resolves
        if: ${{ !inputs.dry_run }}
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAJOR_REF="v${MAJOR}"

          RESOLVED=$(git ls-remote origin "refs/heads/${MAJOR_REF}" | cut -f1)
          if [ -z "${RESOLVED}" ]; then
            echo "::error::${MAJOR_REF} does not resolve. 'uses: Laughing-Man-Studios/FreeReview@${MAJOR_REF}' would fail at load time for every consumer."
            exit 1
          fi

          # A ref can resolve and still be unusable, so check what a consumer
          # actually gets: an action.yml with a `runs` block on the runtime we
          # declare. Read from the fetched ref, never from the working tree —
          # the working tree is this commit, which is what we *just* verified, so
          # checking it would prove nothing about the ref.
          WORK=$(mktemp -d)
          trap 'rm -rf "${WORK}"' EXIT
          git fetch --no-tags --depth 1 origin "${MAJOR_REF}"
          git show "FETCH_HEAD:action.yml" > "${WORK}/action.yml" 2>/dev/null || {
            echo "::error::${MAJOR_REF} has no action.yml at its tip."
            exit 1
          }

          grep -q '^runs:' "${WORK}/action.yml" || {
            echo "::error::action.yml at ${MAJOR_REF} has no 'runs:' block."
            exit 1
          }
          grep -qE 'using: .node24.' "${WORK}/action.yml" || {
            echo "::error::action.yml at ${MAJOR_REF} does not declare runs.using: node24."
            exit 1
          }
          grep -q 'dist/index.js' "${WORK}/action.yml" || {
            echo "::error::action.yml at ${MAJOR_REF} does not point at dist/index.js."
            exit 1
          }

          # And that the bundle the ref points at is really there. A JavaScript
          # action with a `runs` block and no committed bundle fails at load with
          # no code executed, which is the worst possible failure mode.
          git show "FETCH_HEAD:dist/index.js" > "${WORK}/index.js" 2>/dev/null || {
            echo "::error::${MAJOR_REF} points at a commit with no dist/index.js."
            exit 1
          }
          SIZE=$(wc -c < "${WORK}/index.js")
          if [ "${SIZE}" -lt 1000 ]; then
            echo "::error::dist/index.js at ${MAJOR_REF} is only ${SIZE} bytes."
            exit 1
          fi

          echo "${MAJOR_REF} resolves to ${RESOLVED}, carries a loadable action.yml, and its bundle is ${SIZE} bytes"
